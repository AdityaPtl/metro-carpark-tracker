name: Track car park occupancy

on:
  schedule:
    # Fires every 5 minutes, all day, every day. tracker.py decides whether to
    # take a reading: every 5 min at weekday peaks (5–10am, 3–7pm Sydney time),
    # every 10 min otherwise. Working in Sydney time inside the script means
    # daylight-saving changes need no edits here.
    - cron: "*/5 * * * *"
  workflow_dispatch:   # lets you press "Run workflow" to test it any time

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take snapshot
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: python tracker.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit new data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Car park snapshot $(TZ=Australia/Sydney date '+%a %d %b %H:%M')"
            git pull --rebase
            git push
          else
            echo "No new data."
          fi
